services:
  # MySQL Database Service
  mysql:
    image: mysql:8.0
    container_name: telegram_mysql
    restart: always
    environment:
      TZ: Asia/Phnom_Penh
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-1234}
    ports:
      - "${HOST_DB_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-1234}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - telegram_net

  # NestJS Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: telegram_backend
    restart: always
    environment:
      TZ: Asia/Phnom_Penh
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-1234}
      DB_DATABASE: ${DB_DATABASE:-telegram_app}
      DB_SUPERADMIN_DATABASE: ${DB_SUPERADMIN_DATABASE:-super_admin_attendances_db}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-8982771897:AAGjMp4SYiLGQSyUsotEAIaIOQ4wWLsQrm0}
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_telegram_attendance_2026}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      FRONTEND_URL: ${FRONTEND_URL:-https://shot-pastor-comment-absence.trycloudflare.com}
    ports:
      - "3000:3000"
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - telegram_net

  # Vue 3 / Nginx Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: telegram_frontend
    restart: always
    ports:
      - "3333:3333"
      - "5555:5555"
    depends_on:
      - backend
    networks:
      - telegram_net

volumes:
  mysql_data:
    driver: local
  backend_uploads:
    driver: local

networks:
  telegram_net:
    driver: bridge
