services:
  mysql:
    image: mysql:8.0
    container_name: telegram_mysql
    restart: always
    environment:
      TZ: Asia/Phnom_Penh
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-1234}
    ports:
      - "${HOST_DB_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-1234}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - telegram_net

  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: telegram_backend_dev
    restart: always
    volumes:
      - .:/app
      - /app/node_modules
      - ./uploads:/app/uploads
    command: npm run start:dev
    environment:
      TZ: Asia/Phnom_Penh
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-1234}
      DB_DATABASE: ${DB_DATABASE:-telegram_attendance_db}
      DB_SUPERADMIN_DATABASE: ${DB_DATABASE:-telegram_attendance_db}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-8982771897:AAGjMp4SYiLGQSyUsotEAIaIOQ4wWLsQrm0}
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_telegram_attendance_2026}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    ports:
      - "3000:3000"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - telegram_net

volumes:
  mysql_data:

networks:
  telegram_net:
    driver: bridge
